<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahirab Materials</title>
    <!-- Telegram WebApp & Adsgram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #222;
            padding: 16px;
            margin: 0;
            text-align: center;
        }
        h2 { color: #0088cc; }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card h3 { margin: 0 0 8px 0; font-size: 17px; color: #111; }
        .card p { color: #666; font-size: 13px; margin-bottom: 12px; }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            display: block;
        }
    </style>
</head>
<body>

    <h2>📚 Bahirab Materials</h2>
    <p>የሚፈልጉትን ማቴሪያል ይምረጡና ማስታወቂያ አይተው ያውርዱ፦</p>

    <div class="card">
        <h3>📖 Macroeconomics Summary Notes</h3>
        <p>መጠን፡ 2.8 MB • Year 2 / Semester 1</p>
        <button class="btn" onclick="watchAd('https://t.me/')">📥 ማስታወቂያ አይተህ አውርድ</button>
    </div>

    <div class="card">
        <h3>📝 Econometrics Mid Exam & Answers</h3>
        <p>መጠን፡ 1.5 MB • Exam Questions</p>
        <button class="btn" onclick="watchAd('https://t.me/')">📥 ማስታወቂያ አይተህ አውርድ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // የራስህ ትክክለኛ Adsgram Block ID
        const adController = window.Adsgram.init({ blockId: "int-44107" });

        function watchAd(downloadUrl) {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "እባክዎ ይጠብቁ...";

            adController.show().then((result) => {
                btn.innerText = originalText;
                tg.showAlert("ማስታወቂያውን ስላዩ እናመሰግናለን! ማውረድ ጀምሯል።");
                tg.openLink(downloadUrl);
            }).catch((err) => {
                btn.innerText = originalText;
                tg.showAlert("ማስታወቂያው አልተጠናቀቀም ወይም አልተገኘም!");
            });
        }
    </script>
</body>
</html>
